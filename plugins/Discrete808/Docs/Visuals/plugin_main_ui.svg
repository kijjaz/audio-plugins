<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="450" fill="#111111" />
  
  <!-- Technical Grid -->
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#grid)" />

  <!-- Header Section -->
  <text x="20" y="45" font-family="Helvetica Neue, sans-serif" font-size="32" font-weight="bold" fill="#B8860B">DISCRETE 808 MKII</text>
  <text x="22" y="70" font-family="Helvetica Neue, sans-serif" font-size="12" fill="#888">HIGH-FIDELITY ANALOG COMPONENT MODELING</text>
  
  <!-- Percussion Engine Container -->
  <rect x="10" y="90" width="700" height="320" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
  <text x="20" y="105" font-family="Helvetica Neue, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">PERCUSSION ENGINE</text>

  <!-- Channel Strips (Simplified) -->
  <g transform="translate(15, 120)">
    <rect width="55" height="280" fill="rgba(184, 134, 11, 0.1)" stroke="rgba(184, 134, 11, 0.3)" />
    <text x="27" y="270" text-anchor="middle" font-family="Helvetica Neue, sans-serif" font-size="10" font-weight="bold" fill="white">BD</text>
    <!-- Knobs -->
    <circle cx="27" cy="40" r="15" fill="#222" stroke="#B8860B" stroke-width="2" />
    <circle cx="27" cy="90" r="15" fill="#222" stroke="#B8860B" stroke-width="2" />
    <circle cx="27" cy="140" r="20" fill="#222" stroke="#B8860B" stroke-width="2" /> <!-- Level -->
    <circle cx="15" cy="190" r="8" fill="#222" stroke="#888" stroke-width="1" /> <!-- Vel Tone -->
    <circle cx="40" cy="190" r="8" fill="#222" stroke="#888" stroke-width="1" /> <!-- Vel Decay -->
  </g>
  
  <!-- Repeat for a few more -->
  <g transform="translate(73, 120)">
    <rect width="55" height="280" fill="none" stroke="rgba(255,255,255,0.1)" />
    <text x="27" y="270" text-anchor="middle" font-family="Helvetica Neue, sans-serif" font-size="10" font-weight="bold" fill="rgba(255,255,255,0.7)">SD</text>
    <circle cx="27" cy="40" r="15" fill="#222" stroke="#888" stroke-width="1" />
    <circle cx="27" cy="90" r="15" fill="#222" stroke="#888" stroke-width="1" />
    <circle cx="27" cy="140" r="20" fill="#222" stroke="#888" stroke-width="1" />
    <circle cx="15" cy="190" r="8" fill="#222" stroke="#666" stroke-width="1" />
    <circle cx="40" cy="190" r="8" fill="#222" stroke="#666" stroke-width="1" />
  </g>

  <!-- Help Button -->
  <rect x="720" y="20" width="60" height="30" rx="5" fill="#B8860B" />
  <text x="750" y="40" text-anchor="middle" font-family="Helvetica Neue, sans-serif" font-size="10" font-weight="bold" fill="black">HELP</text>
  
  <!-- Master Controls (Simplified) -->
  <g transform="translate(720, 100)">
    <text x="0" y="0" font-family="Helvetica Neue, sans-serif" font-size="10" fill="gold">MASTER</text>
    <circle cx="30" cy="40" r="20" fill="#222" stroke="gold" />
    <text x="30" y="75" text-anchor="middle" font-family="Helvetica Neue, sans-serif" font-size="8" fill="#888">ACCENT</text>
    <circle cx="30" cy="120" r="20" fill="#222" stroke="gold" />
    <text x="30" y="155" text-anchor="middle" font-family="Helvetica Neue, sans-serif" font-size="8" fill="#888">LEVEL</text>
  </g>
</svg>
