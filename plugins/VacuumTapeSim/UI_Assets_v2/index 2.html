<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vacuum Tape Sim Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#c5a463",
                        "background-dark": "#0a0a09",
                        "carbon": "#161513",
                        "gold-deep": "#8b7345",
                        "gold-bright": "#e5c17e",
                    },
                    fontFamily: {
                        "display": ["Epilogue", "sans-serif"],
                        "serif": ["Playfair Display", "serif"]
                    },
                    backgroundImage: {
                        'carbon-texture': "url('https://www.transparenttextures.com/patterns/carbon-fibre.png')",
                    },
                    animation: {
                        'spin-slow': 'spin 4s linear infinite',
                        'spin-reverse-slow': 'spin 4s linear infinite reverse',
                    }
                },
            },
        }
    </script>
    <style>
      body {
        background-color: #0a0a09;
        color: white;
      }
      /* Custom Scrollbar for webkit */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #0a0a09; 
      }
      ::-webkit-scrollbar-thumb {
        background: #161513; 
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #c5a463; 
      }
    </style>

}
