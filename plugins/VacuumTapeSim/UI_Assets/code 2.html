<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#c5a463",
                        "background-dark": "#0a0a09",
                        "carbon": "#161513",
                        "gold-deep": "#8b7345",

<style type="text/tailwindcss">
        @layer components {
            .knob-3d {
                background: radial-gradient(circle at 35% 35%, #5a4b2d 0%, #1e1b14 70%, #0a0a09 100%);
                box-shadow: 
                    inset 0 2px 4px rgba(255,255,255,0.1),
                    inset 0 -2px 10px rgba(0,0,0,0.8),
                    0 10px 20px rgba(0,0,0,0.6);
            }
            .knob-ring {
                background: conic-gradient(from 0deg, transparent, #c5a463 30%, transparent 31%);
                @apply absolute inset-[-4px] rounded-full opacity-30;
            }
            .recessed-panel {
                @apply bg-carbon rounded-xl border border-white/5;
                box-shadow: inset 0 2px 15px rgba(0,0,0,0.8);
            }
            .tube-glow {
                box-shadow: 0 0 30px 10px rgba(197, 164, 99, 0.2);
            }
            .reel-spinning {
                animation: spin 4s linear infinite;
            }
            @keyframes spin {
                from { transform: rotate(0deg); }
                to { transform: rotate(360deg); }
            }
            .stamp-effect {
                font-family: 'Courier New', Courier, monospace;
                @apply border-2 border-primary/40 text-primary/40 px-2 py-0.5 rounded uppercase font-bold text-[8px] rotate-[-5deg] mix-blend-overlay;
            }
        }
    </style>
