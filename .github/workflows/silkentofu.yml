name: Build SilkenTofu

on:
  push:
    paths:
      - 'plugins/SilkenTofu/**'
      - '.github/workflows/silkentofu.yml'
    branches: [ "main", "master" ]
    tags: [ "silkentofu-*" ]
  pull_request:
    paths:
      - 'plugins/SilkenTofu/**'
      - '.github/workflows/silkentofu.yml'
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows VST3
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -S plugins/SilkenTofu -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release --parallel

    - name: Upload VST3 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SilkenTofu-Windows-VST3
        path: build/SilkenTofu_artefacts/Release/VST3/Silken Tofu.vst3
        if-no-files-found: error

  build-macos:
    name: Build macOS VST3/AU/App
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -S plugins/SilkenTofu -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

    - name: Build
      run: cmake --build build --config Release --parallel

    - name: Upload VST3 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SilkenTofu-macOS-VST3
        path: build/SilkenTofu_artefacts/Release/VST3/Silken Tofu.vst3
        if-no-files-found: error

    - name: Upload AU Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SilkenTofu-macOS-AU
        path: build/SilkenTofu_artefacts/Release/AU/Silken Tofu.component
        if-no-files-found: error

    - name: Upload Standalone App Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SilkenTofu-macOS-Standalone
        path: build/SilkenTofu_artefacts/Release/Standalone/Silken Tofu.app
        if-no-files-found: error

  release:
    name: Publish Direct Download Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    permissions:
      contents: write
    steps:
      - name: Download Windows VST3
        uses: actions/download-artifact@v4
        with:
          name: SilkenTofu-Windows-VST3
          path: windows_vst3/SilkenTofu.vst3

      - name: Download macOS VST3
        uses: actions/download-artifact@v4
        with:
          name: SilkenTofu-macOS-VST3
          path: macos_bundle/SilkenTofu.vst3

      - name: Download macOS AU
        uses: actions/download-artifact@v4
        with:
          name: SilkenTofu-macOS-AU
          path: macos_bundle/SilkenTofu.component

      - name: Download macOS Standalone
        uses: actions/download-artifact@v4
        with:
          name: SilkenTofu-macOS-Standalone
          path: macos_bundle/SilkenTofu.app

      - name: Package Zip Bundles
        run: |
          mkdir -p release_pkgs
          cd macos_bundle
          zip -r ../release_pkgs/SilkenTofu-macOS-Universal.zip SilkenTofu.vst3 SilkenTofu.component SilkenTofu.app
          cd ..
          cd windows_vst3
          zip -r ../release_pkgs/SilkenTofu-Windows-x64.zip SilkenTofu.vst3
          cd ..

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: silkentofu-v0.0.4
          name: "Silken Tofu v0.0.4 — Teletronix LA-2A & T4B Electro-Optical Leveling Amplifier"
          body: |
            ### Silken Tofu v0.0.4 — Teletronix LA-2A & T4B Electro-Optical Leveling Amplifier + Mid-Side & Oversampled Tube/Iron Suite

            #### 📦 Direct 1-Click Downloads:
            - **[SilkenTofu-macOS-Universal.zip](https://github.com/kijjaz/audio-plugins/releases/download/silkentofu-v0.0.4/SilkenTofu-macOS-Universal.zip)** — VST3, AU (Component), and Standalone app for macOS (Universal: Apple Silicon arm64 & Intel x86_64).
            - **[SilkenTofu-Windows-x64.zip](https://github.com/kijjaz/audio-plugins/releases/download/silkentofu-v0.0.4/SilkenTofu-Windows-x64.zip)** — VST3 64-bit for Windows.

            #### 🌟 What's New in v0.0.4:
            - **Independent Mid-Side (`M/S`) Mastering Mode + `Solo Mid / Side` + `Copy M>S`:** Full dual parameter banks (`MID` and `SIDE`) so you can run different T4B crystals, Peak Reduction, Tube/Iron drive, and sidechain filters on Center vs. Stereo Width, plus instant `Solo Mid` / `Solo Side` auditioning.
            - **Dual-Needle (`Mid/L` + `Side/R`) Illuminated VU Meter (`[GR | OUT | IN]`):** Switch between Gain Reduction (`dB`), Output VU (`0 VU = -18 dBFS`), and Input VU, with a translucent companion ghost needle tracking the secondary channel whenever `M/S` is active or `Stereo Link < 99%`.
            - **Real-Time Scrolling `GR` + Deep-Trap ($N_2$) CRT History Trace:** Live 60 FPS phosphor strip-chart overlaid on the Two-Trap release trajectory scope in Card 1 (click scope to toggle overlay).
            - **`A / B` State Comparison (`[A | B | A>B]`) & Zero-Latency-Jump Soft Bypass (`BYP`):** Instant full-state A/B comparison and phase-coherent oversampled bypass crossfading that preserves DAW PDC latency without clicks.
            - **Sample-Accurate Parameter Smoothing & Closed-Loop `12AX7A / B+` Feedback Coupling:** 1-pole exponential knob smoothing (`12 ms`), oversampled $C^1$-continuous T4B envelope interpolation, and closed-loop coupling from `12AX7A` harmonic bloom & `275V B+` sag back into the `6AQ5` EL panel drive.
          files: |
            release_pkgs/SilkenTofu-macOS-Universal.zip
            release_pkgs/SilkenTofu-Windows-x64.zip
