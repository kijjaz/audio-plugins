name: Build AetherBeam Reverb (Multi-Platform)

on:
  push:
    paths:
      - 'plugins/AetherBeam/**'
      - '.github/workflows/aetherbeam.yml'
  pull_request:
    paths:
      - 'plugins/AetherBeam/**'
      - '.github/workflows/aetherbeam.yml'
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. macOS (Universal arm64 + x86_64)
  # ==========================================
  build-macos:
    name: Build macOS VST3/AU
    runs-on: macos-14
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Configure CMake
      run: cmake -S plugins/AetherBeam -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      
    - name: Build
      run: cmake --build build --config Release --parallel 4

    - name: Strip Detritus & Ad-Hoc Sign
      run: |
        xattr -cr "build/AetherBeam_artefacts/Release/VST3/AetherBeam Reverb.vst3" || true
        codesign --force --deep -s - "build/AetherBeam_artefacts/Release/VST3/AetherBeam Reverb.vst3" || true
        xattr -cr "build/AetherBeam_artefacts/Release/AU/AetherBeam Reverb.component" || true
        codesign --force --deep -s - "build/AetherBeam_artefacts/Release/AU/AetherBeam Reverb.component" || true
      
    - name: Upload macOS VST3 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AetherBeam-macOS-VST3
        path: build/AetherBeam_artefacts/Release/VST3/AetherBeam Reverb.vst3
        if-no-files-found: error

    - name: Upload macOS AU Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AetherBeam-macOS-AU
        path: build/AetherBeam_artefacts/Release/AU/AetherBeam Reverb.component
        if-no-files-found: error

  # ==========================================
  # 2. Windows (x64)
  # ==========================================
  build-windows:
    name: Build Windows VST3
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Configure CMake
      run: cmake -S plugins/AetherBeam -B build -DCMAKE_BUILD_TYPE=Release
      
    - name: Build
      run: cmake --build build --config Release --parallel 4
      
    - name: Upload Windows VST3 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AetherBeam-Windows-VST3
        path: build/AetherBeam_artefacts/Release/VST3/AetherBeam Reverb.vst3
        if-no-files-found: error

  # ==========================================
  # 3. Linux (x86_64)
  # ==========================================
  build-linux:
    name: Build Linux VST3
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v4

    - name: Install JUCE Linux Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libasound2-dev \
          libjack-jackd2-dev \
          ladspa-sdk \
          libcurl4-openssl-dev \
          libfreetype6-dev \
          libx11-dev \
          libxcomposite-dev \
          libxcursor-dev \
          libxext-dev \
          libxinerama-dev \
          libxrandr-dev \
          libxrender-dev \
          mesa-common-dev \
          libgl1-mesa-dev \
          libglu1-mesa-dev

    - name: Configure CMake
      run: cmake -S plugins/AetherBeam -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release --parallel 4

    - name: Upload Linux VST3 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AetherBeam-Linux-VST3
        path: build/AetherBeam_artefacts/Release/VST3/AetherBeam Reverb.vst3
        if-no-files-found: error
