name: Build AetherBeam Reverb (Multi-Platform)

on:
  push:
    paths:
      - 'plugins/AetherBeam/**'
      - '.github/workflows/aetherbeam.yml'
    branches: [ "main", "master" ]
    tags: [ "aetherbeam-*" ]
  pull_request:
    paths:
      - 'plugins/AetherBeam/**'
      - '.github/workflows/aetherbeam.yml'
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. macOS (Universal arm64 + x86_64)
  # ==========================================
  build-macos:
    name: Build macOS VST3/AU
    runs-on: macos-14
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Configure CMake
      run: cmake -S plugins/AetherBeam -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      
    - name: Build
      run: cmake --build build --config Release --parallel 4

    - name: Strip Detritus & Ad-Hoc Sign
      run: |
        xattr -cr "build/AetherBeam_artefacts/Release/VST3/AetherBeam Reverb.vst3" || true
        codesign --force --deep -s - "build/AetherBeam_artefacts/Release/VST3/AetherBeam Reverb.vst3" || true
        xattr -cr "build/AetherBeam_artefacts/Release/AU/AetherBeam Reverb.component" || true
        codesign --force --deep -s - "build/AetherBeam_artefacts/Release/AU/AetherBeam Reverb.component" || true
      
    - name: Upload macOS VST3 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AetherBeam-macOS-VST3
        path: build/AetherBeam_artefacts/Release/VST3/AetherBeam Reverb.vst3
        if-no-files-found: error

    - name: Upload macOS AU Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AetherBeam-macOS-AU
        path: build/AetherBeam_artefacts/Release/AU/AetherBeam Reverb.component
        if-no-files-found: error

  # ==========================================
  # 2. Windows (x64)
  # ==========================================
  build-windows:
    name: Build Windows VST3
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Configure CMake
      run: cmake -S plugins/AetherBeam -B build -DCMAKE_BUILD_TYPE=Release
      
    - name: Build
      run: cmake --build build --config Release --parallel 4
      
    - name: Upload Windows VST3 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AetherBeam-Windows-VST3
        path: build/AetherBeam_artefacts/Release/VST3/AetherBeam Reverb.vst3
        if-no-files-found: error

  # ==========================================
  # 3. Linux (x86_64)
  # ==========================================
  build-linux:
    name: Build Linux VST3
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v4

    - name: Install JUCE Linux Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libasound2-dev \
          libjack-jackd2-dev \
          ladspa-sdk \
          libcurl4-openssl-dev \
          libfreetype6-dev \
          libx11-dev \
          libxcomposite-dev \
          libxcursor-dev \
          libxext-dev \
          libxinerama-dev \
          libxrandr-dev \
          libxrender-dev \
          mesa-common-dev \
          libgl1-mesa-dev \
          libglu1-mesa-dev

    - name: Configure CMake
      run: cmake -S plugins/AetherBeam -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release --parallel 4

    - name: Upload Linux VST3 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AetherBeam-Linux-VST3
        path: build/AetherBeam_artefacts/Release/VST3/AetherBeam Reverb.vst3
        if-no-files-found: error

  release:
    name: Publish Direct Download Release
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    permissions:
      contents: write
    steps:
      - name: Download Windows VST3
        uses: actions/download-artifact@v4
        with:
          name: AetherBeam-Windows-VST3
          path: windows_vst3/AetherBeam Reverb.vst3

      - name: Download macOS VST3
        uses: actions/download-artifact@v4
        with:
          name: AetherBeam-macOS-VST3
          path: macos_bundle/AetherBeam Reverb.vst3

      - name: Download macOS AU
        uses: actions/download-artifact@v4
        with:
          name: AetherBeam-macOS-AU
          path: macos_bundle/AetherBeam Reverb.component

      - name: Download Linux VST3
        uses: actions/download-artifact@v4
        with:
          name: AetherBeam-Linux-VST3
          path: linux_vst3/AetherBeam Reverb.vst3

      - name: Package Zip Bundles
        run: |
          mkdir -p release_pkgs
          # Zip macOS Universal Bundle
          cd macos_bundle
          zip -r ../release_pkgs/AetherBeam-macOS-Universal.zip "AetherBeam Reverb.vst3" "AetherBeam Reverb.component"
          cd ..
          # Zip Windows VST3 Bundle
          cd windows_vst3
          zip -r ../release_pkgs/AetherBeam-Windows-x64.zip "AetherBeam Reverb.vst3"
          cd ..
          # Zip Linux VST3 Bundle
          cd linux_vst3
          zip -r ../release_pkgs/AetherBeam-Linux-x64.zip "AetherBeam Reverb.vst3"
          cd ..

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aetherbeam-v1.0.0
          name: "AetherBeam Reverb v1.0.0 — 3D Ray-Tracing Acoustic Reverb"
          body: |
            ### AetherBeam Reverb v1.0.0 — Real-Time 3D Ray-Tracing Acoustic Reverb & Nonlinear Waveguide
            
            #### 📦 Direct Downloads:
            - **[AetherBeam-macOS-Universal.zip](https://github.com/kijjaz/audio-plugins/releases/download/aetherbeam-v1.0.0/AetherBeam-macOS-Universal.zip)** — VST3 and AU (Component) for macOS (Apple Silicon arm64 & Intel x86_64).
            - **[AetherBeam-Windows-x64.zip](https://github.com/kijjaz/audio-plugins/releases/download/aetherbeam-v1.0.0/AetherBeam-Windows-x64.zip)** — VST3 64-bit for Windows.
            - **[AetherBeam-Linux-x64.zip](https://github.com/kijjaz/audio-plugins/releases/download/aetherbeam-v1.0.0/AetherBeam-Linux-x64.zip)** — VST3 64-bit for Linux.
            
            #### 🌟 Highlights:
            - Orders 0–4 physical specular ray tracing (up to 96 paths) with 3D wireframe perspective mesh.
            - Spatial microphone polar patterns: Binaural, ORTF, Blumlein, and Omni.
            - Dynamic audience occupancy absorption simulator & finite-amplitude wave steepening.
            - 3-band material damping EQ.
          files: |
            release_pkgs/AetherBeam-macOS-Universal.zip
            release_pkgs/AetherBeam-Windows-x64.zip
            release_pkgs/AetherBeam-Linux-x64.zip

