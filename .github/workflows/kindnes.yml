name: Build Kindnes

on:
  push:
    paths:
      - 'plugins/Kindnes/**'
      - '.github/workflows/kindnes.yml'
    branches: [ "main", "master" ]
    tags: [ "kindnes-*" ]
  pull_request:
    paths:
      - 'plugins/Kindnes/**'
      - '.github/workflows/kindnes.yml'
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows VST3
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Configure CMake
      run: cmake -S plugins/Kindnes -B build -DCMAKE_BUILD_TYPE=Release
      
    - name: Build
      run: cmake --build build --config Release --parallel
      
    - name: Upload VST3 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kindnes-Windows-VST3
        path: build/Kindnes_artefacts/Release/VST3/Kindnes.vst3
        if-no-files-found: error

  build-macos:
    name: Build macOS VST3/AU/Standalone
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Configure CMake
      run: cmake -S plugins/Kindnes -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      
    - name: Build
      run: cmake --build build --config Release --parallel
      
    - name: Upload VST3 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kindnes-macOS-VST3
        path: build/Kindnes_artefacts/Release/VST3/Kindnes.vst3
        if-no-files-found: error

    - name: Upload AU Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kindnes-macOS-AU
        path: build/Kindnes_artefacts/Release/AU/Kindnes.component
        if-no-files-found: error

    - name: Upload Standalone Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kindnes-macOS-Standalone
        path: build/Kindnes_artefacts/Release/Standalone/Kindnes.app
        if-no-files-found: error

  release:
    name: Publish Direct Download Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    permissions:
      contents: write
    steps:
      - name: Download Windows VST3
        uses: actions/download-artifact@v4
        with:
          name: Kindnes-Windows-VST3
          path: windows_vst3/Kindnes.vst3

      - name: Download macOS VST3
        uses: actions/download-artifact@v4
        with:
          name: Kindnes-macOS-VST3
          path: macos_bundle/Kindnes.vst3

      - name: Download macOS AU
        uses: actions/download-artifact@v4
        with:
          name: Kindnes-macOS-AU
          path: macos_bundle/Kindnes.component

      - name: Download macOS Standalone
        uses: actions/download-artifact@v4
        with:
          name: Kindnes-macOS-Standalone
          path: macos_bundle/Kindnes.app

      - name: Package Zip Bundles
        run: |
          mkdir -p release_pkgs
          # Zip macOS Universal Bundle
          cd macos_bundle
          zip -r ../release_pkgs/Kindnes-macOS-Universal.zip Kindnes.vst3 Kindnes.component Kindnes.app
          cd ..
          # Zip Windows VST3 Bundle
          cd windows_vst3
          zip -r ../release_pkgs/Kindnes-Windows-x64.zip Kindnes.vst3
          cd ..
          # Copy SFZ Sample Pack if present
          if [ -f "Kindnes-SFZ-Pack-96k-24bit.zip" ]; then
            cp Kindnes-SFZ-Pack-96k-24bit.zip release_pkgs/
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kindnes-v0.0.4
          name: "Kindnes v0.0.4 — Multi-Curve Pitch Engine, Transient Clicks & Chromatic Drum Synth"
          fail_on_unmatched_files: false
          body: |
            ### Kindnes v0.0.4 — High-Fidelity 8-Bit 2A03 APU, FDS 2C33 & VRC6 Synthesizer Suite & Advanced Drum Designer
            
            #### 📦 Direct Downloads:
            - **[Kindnes-macOS-Universal.zip](https://github.com/kijjaz/audio-plugins/releases/download/kindnes-v0.0.4/Kindnes-macOS-Universal.zip)** — VST3, AU (Audio Unit), and Standalone App for macOS (Apple Silicon arm64 & Intel x86_64).
            - **[Kindnes-Windows-x64.zip](https://github.com/kijjaz/audio-plugins/releases/download/kindnes-v0.0.4/Kindnes-Windows-x64.zip)** — VST3 64-bit for Windows.
            - **[Kindnes-SFZ-Pack-96k-24bit.zip](https://github.com/kijjaz/audio-plugins/releases/download/kindnes-v0.0.4/Kindnes-SFZ-Pack-96k-24bit.zip)** — Complete 96kHz 24-bit SFZ Sample Pack containing 11 basic waveform instruments, 61 chromatic drum/sfx voices, and 36 arcade game speech voices.
            
            #### 🌟 What's New in v0.0.4:
            - **Multi-Curve Pitch Modulation Engine**:
              - 5 pitch envelope shapes: Exponential Drop, Dual-Stage Click Dive (steep transient punch), Laser Linear Sweep, Pitch Scoop Rise (comic spring/boing), and FM Chirp Modulation (Simmons toms/UFO warps).
              - Dedicated Pitch Sweep Time knob ($5\text{ ms}\dots 300\text{ ms}$) and FM Rate/Depth controls.
            - **Dedicated Transient Click Layer**:
              - 4 transient attack modes: Off, 2A03 Impulse Spike, Square Pop, and Noise Snap with level control to slice through dense chiptune mixes.
            - **Expanded Noise Patterns & Extended Decays (Explosion Engine)**:
              - Added Low-Rumble Swell and Glitch Frame Stutter patterns.
              - Noise decay extended up to $4.0\text{ seconds}$ for dramatic cinematic boss defeats.
            - **Direct DAW MIDI Integration & Tuned Chromatic Synth Mode**:
              - Trigger custom drums on Note 36 (C1 Kick) & Note 38 (D1 Snare), or switch to *Tuned Chromatic Synth* to play tuned 8-bit 808 sub-bass, tuned toms, and lasers across the entire keyboard!
              - **Live Audition Pad**: Real-time audition button for testing drum tweaks instantly.
              - **15 Instant Algorithmic Drum Presets**: One-click recall for Kicks, Snares, Claps, Toms, Cymbals, Cowbells, and Lasers.
            - **Expanded 61-Voice Drum & SFX SFZ Library**:
              - Graded explosions (short pops, medium arcade bombs, large sub rumbles, and dramatic 2.6s & 3.6s boss cataclysms).
              - Physical turntable vinyl scratch modeling with forward/backward velocity scrubbing.
              - Authentic Fairlight CMI tutti orchestra hits with brass bite and bass drum punch.
              - Crisp, resonant chiptune maraca / shaker centered at 6.2 kHz.
            - **36 Authentic Vintage 8-Bit Arcade Game Speech Voices**:
              - 1-Bit DPCM delta modulation speech library mapped chromatically across 3 octaves (C3 to B5 in `8Bit_Game_Speech.sfz`).
            - **32 Studio-Calibrated Factory Presets**: All resting at `trim = 0.0 dB` (unity gain) and verified sample-rate invariant at 44.1 kHz, 48 kHz, and 96 kHz.
          files: |
            release_pkgs/Kindnes-macOS-Universal.zip
            release_pkgs/Kindnes-Windows-x64.zip
            release_pkgs/Kindnes-SFZ-Pack-96k-24bit.zip
