name: Build IronStack

on:
  push:
    paths:
      - 'plugins/IronStack/**'
      - '.github/workflows/ironstack.yml'
  pull_request:
    paths:
      - 'plugins/IronStack/**'
      - '.github/workflows/ironstack.yml'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows VST3
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Configure CMake
      run: cmake -S plugins/IronStack -B build -DCMAKE_BUILD_TYPE=Release
      
    - name: Build
      run: cmake --build build --config Release --parallel
      
    - name: Upload VST3 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: IronStack-Windows-VST3
        path: build/IronStack_artefacts/Release/VST3/IronStack.vst3
        if-no-files-found: error

  build-macos:
    name: Build macOS VST3/AU
    runs-on: macos-14
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Configure CMake
      run: cmake -S plugins/IronStack -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      
    - name: Build
      run: cmake --build build --config Release --parallel
      
    - name: Upload VST3 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: IronStack-macOS-VST3
        path: build/IronStack_artefacts/Release/VST3/IronStack.vst3
        if-no-files-found: error

    - name: Upload AU Artifact
      uses: actions/upload-artifact@v4
      with:
        name: IronStack-macOS-AU
        path: build/IronStack_artefacts/Release/AU/IronStack.component
        if-no-files-found: error
