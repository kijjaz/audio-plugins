name: Build IronStack

on:
  push:
    paths:
      - 'plugins/IronStack/**'
      - '.github/workflows/ironstack.yml'
    branches: [ "main", "master" ]
    tags: [ "ironstack-*" ]
  pull_request:
    paths:
      - 'plugins/IronStack/**'
      - '.github/workflows/ironstack.yml'
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows VST3
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Configure CMake
      run: cmake -S plugins/IronStack -B build -DCMAKE_BUILD_TYPE=Release
      
    - name: Build
      run: cmake --build build --config Release --parallel
      
    - name: Upload VST3 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: IronStack-Windows-VST3
        path: build/IronStack_artefacts/Release/VST3/IronStack.vst3
        if-no-files-found: error

  build-macos:
    name: Build macOS VST3/AU
    runs-on: macos-14
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Configure CMake
      run: cmake -S plugins/IronStack -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      
    - name: Build
      run: cmake --build build --config Release --parallel
      
    - name: Upload VST3 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: IronStack-macOS-VST3
        path: build/IronStack_artefacts/Release/VST3/IronStack.vst3
        if-no-files-found: error

    - name: Upload AU Artifact
      uses: actions/upload-artifact@v4
      with:
        name: IronStack-macOS-AU
        path: build/IronStack_artefacts/Release/AU/IronStack.component
        if-no-files-found: error

  release:
    name: Publish Direct Download Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    permissions:
      contents: write
    steps:
      - name: Download Windows VST3
        uses: actions/download-artifact@v4
        with:
          name: IronStack-Windows-VST3
          path: windows_vst3/IronStack.vst3

      - name: Download macOS VST3
        uses: actions/download-artifact@v4
        with:
          name: IronStack-macOS-VST3
          path: macos_bundle/IronStack.vst3

      - name: Download macOS AU
        uses: actions/download-artifact@v4
        with:
          name: IronStack-macOS-AU
          path: macos_bundle/IronStack.component

      - name: Package Zip Bundles
        run: |
          mkdir -p release_pkgs
          # Zip macOS Universal Bundle
          cd macos_bundle
          zip -r ../release_pkgs/IronStack-macOS-Universal.zip IronStack.vst3 IronStack.component
          cd ..
          # Zip Windows VST3 Bundle
          cd windows_vst3
          zip -r ../release_pkgs/IronStack-Windows-x64.zip IronStack.vst3
          cd ..

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ironstack-v1.0.0
          name: "IronStack v1.0.0 — 8-Amp Preamp & Cabinet Simulator"
          body: |
            ### IronStack v1.0.0 — Component-Level Analog Amplifier & Multi-Cabinet Suite
            
            #### 📦 Direct Downloads:
            - **[IronStack-macOS-Universal.zip](https://github.com/kijjaz/audio-plugins/releases/download/ironstack-v1.0.0/IronStack-macOS-Universal.zip)** — VST3 and AU (Component) for macOS (Apple Silicon arm64 & Intel x86_64).
            - **[IronStack-Windows-x64.zip](https://github.com/kijjaz/audio-plugins/releases/download/ironstack-v1.0.0/IronStack-Windows-x64.zip)** — VST3 64-bit for Windows.
            
            #### 🌟 Highlights:
            - Continuous nodal matrix solvers & Bilinear Transform tone stacks (Bassman, JCM800, SLO-100, Twin Reverb, etc.).
            - Kinetic 12AX7 vacuum tube preamp with dynamic DC cathode bias sag.
            - 8 Tone3000 acoustically-calibrated cabinet impulse responses.
          files: |
            release_pkgs/IronStack-macOS-Universal.zip
            release_pkgs/IronStack-Windows-x64.zip

